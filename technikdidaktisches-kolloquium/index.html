<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23035591%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22%23F5B700%22 font-family=%22Arial%22 font-weight=%22bold%22%3ET%3C/text%3E%3C/svg%3E">
</head><body>
<title>Technikdidaktisches Kolloquium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: Seitenleiste mit Sitzungen (wie die übrigen deinTechniklehrer-Plattformen), Inhalt als Abfolge Input → Aufgabenkarten */
:root{
  --blue:#035591; --blue-d:#023a63; --yellow:#F5B700; --yellow-soft:#fff3c9;
  --ink:#14232f; --muted:#56687a; --paper:#eef3f7; --card:#ffffff; --line:#d3dde6;
  --accent:#035591; --accent-ink:#ffffff; --link:#035591;
  --ok:#17803f; --ok-bg:#e2f4e8; --bad:#c23b2e; --bad-bg:#fce8e5; --miss:#b7791f; --miss-bg:#fff3d6;
  --soz:#c2255c; --soz-bg:#fbe3ec; --hum:#d9480f; --hum-bg:#fde6d7; --nat:#3b6e8f; --nat-bg:#dde9f1;
  --side:#023a63; --side-ink:#eaf3fb; --dim-ink:#ffffff;
  --f-head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051;
    --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
    --ok:#4cc37c; --ok-bg:#12321f; --bad:#ff8074; --bad-bg:#3a1a17; --miss:#f0b95a; --miss-bg:#3a2d10;
    --yellow-soft:#3a3010;
    --soz:#ff8fb5; --soz-bg:#3a1826; --hum:#ff9a5c; --hum-bg:#3a2214; --nat:#8cc3e6; --nat-bg:#14293a;
    --side:#0a141c; --side-ink:#eaf3fb; --dim-ink:#14232f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1922; --card:#152531; --ink:#e9f0f6; --muted:#9db1c1; --line:#2a4051;
  --accent:#3a8fd6; --accent-ink:#04121d; --link:#7fbdf0;
  --ok:#4cc37c; --ok-bg:#12321f; --bad:#ff8074; --bad-bg:#3a1a17; --miss:#f0b95a; --miss-bg:#3a2d10;
  --yellow-soft:#3a3010;
  --soz:#ff8fb5; --soz-bg:#3a1826; --hum:#ff9a5c; --hum-bg:#3a2214; --nat:#8cc3e6; --nat-bg:#14293a;
  --side:#0a141c; --side-ink:#eaf3fb; --dim-ink:#14232f; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(2.3rem,6vw,3.4rem)} h2{font-size:clamp(1.7rem,4vw,2.2rem);margin-top:34px} h3{font-size:1.4rem;font-weight:600}
p{margin:.6em 0} a{color:var(--link)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* Gerüst */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0;overflow-x:clip}
aside{background:var(--side);color:var(--side-ink);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
.brand img{width:190px;height:auto;display:block;background:#fff;padding:8px 10px;border-radius:6px}
.brand b{display:block;font-family:var(--f-head);font-size:1.45rem;line-height:1.05;margin-top:12px}
.brand small{display:block;opacity:.75;font-size:.85rem;margin-top:3px}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;color:var(--side-ink);text-decoration:none;font-weight:500;border-left:4px solid transparent;font-size:.98rem}
nav a:hover{background:rgba(255,255,255,.08)}
nav a[aria-current="page"]{background:rgba(255,255,255,.14);border-left-color:var(--yellow);font-weight:700}
nav .no{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:.78rem;font-weight:700}
nav .done .no{background:var(--yellow);border-color:var(--yellow);color:#14232f}
nav .cnt{margin-left:auto;font-size:.8rem;opacity:.75;font-variant-numeric:tabular-nums}
.sidefoot{margin-top:auto;font-size:.78rem;opacity:.7;line-height:1.4}
.themebtn{background:none;border:1px solid rgba(255,255,255,.3);color:var(--side-ink);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:.85rem;margin-top:8px}
main{padding-block:34px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1020px;width:100%}
@media(min-width:901px){main{padding-left:clamp(24px,4vw,56px);padding-right:clamp(24px,4vw,56px)}}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .topbar{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:var(--side-ink);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .topbar .row{display:flex;align-items:center;gap:10px}
  .topbar img{height:28px;width:auto;background:#fff;padding:3px 6px;border-radius:4px}
  .topbar b{font-family:var(--f-head);font-size:1.15rem}
  .topbar .pct{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.9rem;opacity:.9}
  .pills{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
  .pills a{flex:none;color:var(--side-ink);text-decoration:none;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);font-size:.9rem;white-space:nowrap}
  .pills a[aria-current="page"]{background:var(--yellow);color:#14232f;border-color:var(--yellow);font-weight:700}
  html{scroll-padding-top:120px}
}

/* Kopf einer Sitzung */
.pagehead{margin-bottom:24px;padding-bottom:18px;border-bottom:3px solid transparent;border-image:repeating-linear-gradient(90deg,var(--blue) 0 14px,var(--yellow) 14px 20px) 1}
.eyebrow{font-family:var(--f-head);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:1rem}
.pagehead .lead{font-size:1.15rem;color:var(--muted);max-width:64ch;margin-top:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meta span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.88rem}
.leit{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--yellow);border-radius:0 6px 6px 0;padding:12px 18px;margin:18px 0}
.leit b{font-family:var(--f-head);font-size:1.2rem;display:block}
.leit ol{margin:.3em 0 0;padding-left:1.3em}
.sec{font-family:var(--f-head);font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;color:var(--link);margin:34px 0 8px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:2px;background:var(--line)}

/* Bausteine */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 20px;margin:16px 0}
.quote{background:var(--card);border-left:6px solid var(--blue);border-radius:0 6px 6px 0;padding:14px 20px;margin:16px 0;font-size:1.06rem}
.quote p{margin:.2em 0}
.quote cite{display:block;font-style:normal;font-size:.88rem;color:var(--muted);margin-top:6px}
.merke{border-left:6px solid var(--yellow);background:var(--yellow-soft);padding:12px 16px;border-radius:0 6px 6px 0;margin:16px 0}
.merke b.t{font-family:var(--f-head);font-size:1.2rem;display:block;margin-bottom:2px}
.cite{font-size:.86rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:4px;padding:10px 14px 12px;min-width:0}
.tile h4{font-size:1.25rem;margin:2px 0 4px}
.tile p{font-size:.95rem;margin:.3em 0}
.tile.y{border-top-color:var(--yellow)} .tile.r{border-top-color:var(--bad)} .tile.g{border-top-color:var(--ok)}
.tile .k{font-family:var(--f-head);font-size:2rem;line-height:1;color:var(--link);display:block}
.tag{display:inline-block;background:var(--yellow);color:#14232f;font-weight:700;font-size:.75rem;padding:1px 8px;border-radius:999px;letter-spacing:.03em;vertical-align:middle}
.tag.b{background:var(--accent);color:var(--accent-ink)}
.tscroll{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem;margin:8px 0;background:var(--card)}
.mt th,.mt td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.mt thead th{background:var(--accent);color:var(--accent-ink);font-family:var(--f-head);font-size:1.08rem;font-weight:600}
.mt tbody th{background:var(--paper)}
ul.il{margin:.4em 0;padding-left:1.2em} ul.il li{margin:.25em 0}
details.info{margin:8px 0 14px;border:2px solid var(--line);border-radius:6px;background:var(--paper)}
details.info>summary{cursor:pointer;list-style:none;padding:8px 14px;font-weight:700;color:var(--link);display:flex;gap:10px;align-items:center;min-height:44px}
details.info>summary::-webkit-details-marker{display:none}
details.info>summary::before{content:"i";flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:Georgia,serif;font-style:italic;font-weight:700}
details.info>summary::after{content:"öffnen";margin-left:auto;font-weight:500;font-size:.9rem;color:var(--muted)}
details.info[open]>summary::after{content:"schließen"}
details.info[open]{border-color:var(--accent)}
details.info .ib{padding:2px 16px 12px}

/* Diagramme */
.fig{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin:16px 0}
.fig figcaption{font-size:.86rem;color:var(--muted);margin-top:8px}
.fig svg{display:block;width:100%;height:auto}
.dimfig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.dimfig .core{grid-column:1/-1;justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:10px 26px;text-align:center}
.dimfig .core b{font-family:var(--f-head);font-size:1.6rem;letter-spacing:.25em;display:block}
.dimfig .core span{font-size:.92rem}
.dcol{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0}
.dcol h4{text-align:center;border-radius:999px;padding:8px 6px;font-size:1.15rem}
.dcol span{border-radius:999px;padding:4px 8px;text-align:center;font-size:.9rem;overflow-wrap:anywhere}
.dcol h4{color:var(--dim-ink)}
.dcol.soz h4{background:var(--soz)} .dcol.soz span{background:var(--soz-bg)}
.dcol.hum h4{background:var(--hum)} .dcol.hum span{background:var(--hum-bg)}
.dcol.nat h4{background:var(--nat)} .dcol.nat span{background:var(--nat-bg)}
@media(max-width:560px){.dimfig{gap:6px}.dcol span{font-size:.8rem;padding:4px 4px}.dcol h4{font-size:1rem}}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
@media(max-width:640px){.three{grid-template-columns:minmax(0,1fr)}}
.three div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.three div b{font-family:var(--f-head);font-size:1.35rem;color:var(--link);display:block}
.three div i{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--yellow);color:#14232f;font-weight:800;margin-bottom:6px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:14px 0}
.flow .st{flex:1 1 150px;background:var(--card);border:2px solid var(--accent);border-radius:6px;padding:8px 12px;min-width:0}
.flow .st b{display:block;font-family:var(--f-head);font-size:1.15rem}
.flow .st span{font-size:.9rem;color:var(--muted)}
.flow .ar{align-self:center;color:var(--accent);font-weight:800;font-size:1.3rem}
@media(max-width:640px){.flow{flex-direction:column}.flow .ar{transform:rotate(90deg);align-self:center}}
.layers{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.layers div{border-radius:6px;padding:10px 14px;color:#fff;display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:12px;align-items:center}
.layers div b{font-family:var(--f-head);font-size:1.25rem}
.layers div span{font-size:.93rem}
@media(max-width:600px){.layers div{grid-template-columns:minmax(0,1fr)}}
.lv1{background:#023a63}.lv2{background:#035591}.lv3{background:#2f74ab}.lv4{background:#5a93c2}
.matrix{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem;background:var(--card)}
.matrix th,.matrix td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.matrix .lb th{background:var(--paper);text-align:center;font-family:var(--f-head);font-size:1.05rem}
.matrix .hf th{background:var(--accent);color:var(--accent-ink);font-family:var(--f-head);font-size:1.05rem}
.matrix .th td{background:var(--yellow-soft);font-weight:700;text-align:center}
.states{border-collapse:collapse;min-width:560px;width:100%;font-size:.9rem;background:var(--card)}
.states th,.states td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.states th:first-child,.states td:first-child{text-align:left;white-space:nowrap}
.states thead th{background:var(--paper);font-family:var(--f-head);font-size:1rem}
.states .ni td{background:var(--yellow-soft);font-weight:700}
.dot{display:inline-block;width:18px;height:18px;border-radius:3px;vertical-align:middle}
.dot.f{background:var(--accent)} .dot.v{background:var(--accent);opacity:.35}
.hfg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.hfg div{background:var(--card);border:2px solid var(--line);border-radius:4px;padding:8px 10px;display:flex;gap:10px;align-items:center;min-width:0;font-weight:600;font-size:.95rem}
.hfg div b{font-family:var(--f-head);font-size:1.5rem;color:var(--link);line-height:1}
.hfg div.hot{background:var(--yellow-soft);border-color:var(--yellow)}
.hfg .top,.hfg .bot{grid-column:1/-1;justify-content:center;font-weight:700}
.hfg .top{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hfg .bot{background:var(--paper)}
@media(max-width:560px){.hfg{grid-template-columns:minmax(0,1fr)}}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
@media(max-width:600px){.vs{grid-template-columns:minmax(0,1fr)}}
.vs>div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 16px;min-width:0}
.vs>div.bad{border-top:5px solid var(--bad)} .vs>div.good{border-top:5px solid var(--ok)}
.vs h4{font-size:1.3rem;margin-bottom:6px}
.vs dl{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr);gap:4px 10px;margin:0;font-size:.95rem}
.vs dt{font-weight:700;color:var(--muted)} .vs dd{margin:0}
.road{list-style:none;margin:16px 0;padding:0;display:grid;gap:8px;counter-reset:r}
.road li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.road li .n{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-head);font-size:1.3rem;font-weight:700}
.road li.done .n{background:var(--ok);color:#fff}
.road li b{font-family:var(--f-head);font-size:1.25rem;display:block}
.road li span{font-size:.92rem;color:var(--muted)}
.road li a{white-space:nowrap}
@media(max-width:560px){.road li{grid-template-columns:40px minmax(0,1fr)}.road li a{grid-column:2}}

/* Aufgaben */
.task{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--accent);border-radius:4px;padding:16px 18px 18px;margin:22px 0;scroll-margin-top:90px}
.task.t-text{border-left-color:var(--yellow)}
.task.t-talk{border-left-color:var(--muted)}
.task.done{border-left-color:var(--ok)}
.task .th{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:6px}
.task .th h3{margin:0}
.kind{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.kind.check{border-color:var(--accent);color:var(--link)} .kind.write{border-color:var(--yellow);background:var(--yellow-soft);color:var(--ink)} .kind.talk{border-color:var(--muted)}
.task .state{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--ok)}
.task .q{margin:.2em 0 .8em}
.task .src{font-size:.86rem;color:var(--muted);margin:-.4em 0 .8em}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:4px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--accent)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#14232f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.fb{margin-top:12px;font-weight:600}
.fb .msg{display:block;padding:10px 14px;border-radius:4px;border-left:5px solid}
.fb .good{background:var(--ok-bg);border-color:var(--ok)} .fb .warn{background:var(--miss-bg);border-color:var(--miss)} .fb .bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .why{display:block;font-weight:400;margin-top:4px}
textarea.ans{width:100%;min-height:120px;border:2px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--card);color:var(--ink);resize:vertical;line-height:1.5}
textarea.ans:focus,input.txt:focus,select.sel:focus{border-color:var(--accent);outline:none}
input.txt{width:100%;border:2px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--card);min-height:42px}
.saved{font-size:.82rem;color:var(--muted)}
.eh{margin-top:12px;background:var(--paper);border:1px dashed var(--accent);border-radius:6px;padding:10px 16px}
.eh b.t{font-family:var(--f-head);font-size:1.15rem;color:var(--link)}
.eh ul{margin:.3em 0;padding-left:1.2em}
.fields{display:grid;gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem}
.fields label small{font-weight:400;color:var(--muted)}
.fields textarea{min-height:76px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:640px){.fields.two{grid-template-columns:minmax(0,1fr)}}
/* Sortieren */
.pool,.bin .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.pool{border:2px dashed var(--line);border-radius:6px;padding:8px;margin-bottom:12px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.bin{border:2px solid var(--accent);border-radius:6px;padding:8px 10px 10px;background:var(--card);cursor:pointer;min-width:0}
.bin h4{margin:0 0 6px;font-size:1.2rem;color:var(--link)}
.bin.target{box-shadow:0 0 0 3px var(--yellow)}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;cursor:pointer;font-weight:600;font-size:.93rem;text-align:left;max-width:100%}
.chip.sel{background:var(--yellow);border-color:var(--yellow);color:#14232f}
.chip.ok{background:var(--ok-bg);border-color:var(--ok)} .chip.bad{background:var(--bad-bg);border-color:var(--bad)}
/* Zuordnen */
.assign{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:10px;align-items:center;border:2px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--card)}
.arow.ok{border-color:var(--ok);background:var(--ok-bg)} .arow.bad{border-color:var(--bad);background:var(--bad-bg)}
@media(max-width:600px){.arow{grid-template-columns:minmax(0,1fr)}}
select.sel{border:2px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--card);min-height:42px;width:100%}
/* Auswahl */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;margin-top:2px;display:grid;place-items:center}
.opt.multi .mark{border-radius:4px}
.opt input:checked + .mark{background:var(--accent);border-color:var(--accent)}
.opt input:checked + .mark::after{content:"";width:8px;height:8px;background:var(--accent-ink);border-radius:50%}
.opt input:focus-visible + .mark{outline:3px solid var(--yellow);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.miss{border-color:var(--miss);border-style:dashed}
.hintline{font-size:.9rem;color:var(--muted);margin:0 0 8px}
/* Thesen-Skala */
.thesis{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;background:var(--card)}
.thesis p{margin:0 0 6px;font-weight:600}
.scale{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.scale button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.86rem;font-weight:600;min-height:36px}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.thesis textarea{min-height:52px}
/* Raster */
.gridtask{overflow-x:auto}
.gridtask table{border-collapse:collapse;width:100%;min-width:560px}
.gridtask th,.gridtask td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.gridtask thead th{background:var(--accent);color:var(--accent-ink);font-family:var(--f-head);font-size:1.05rem;font-weight:600}
.gridtask tbody th{background:var(--paper);font-size:.95rem;min-width:130px}
.gridtask textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:3px;padding:6px 8px;background:var(--card);color:var(--ink);resize:vertical}
.gridtask select{width:100%}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:7px 10px;background:var(--card);cursor:pointer}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
/* Test */
.qcard{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--accent);padding:16px 20px;border-radius:4px}
.qcard .qq{font-size:1.12rem;font-weight:600;margin:.2em 0 .8em}
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-head);font-size:4rem;line-height:1;color:var(--link)}
.rev{display:grid;gap:10px;margin-top:16px}
.rev .ri{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:4px;padding:10px 14px}
.rev .ri.wrong{border-left-color:var(--bad)}
.pbar{display:flex;gap:3px;margin:8px 0}
.pbar i{flex:1;height:10px;background:var(--line);border-radius:2px}
.pbar i.on{background:var(--accent)} .pbar i.cur{background:var(--yellow)}
/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:26px;align-items:center;margin-bottom:10px}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2rem,4.2vw,3rem);hyphens:auto;overflow-wrap:break-word}
.hero img.logo{width:min(280px,70%);height:auto;background:#fff;padding:10px 12px;border-radius:8px;margin-bottom:14px}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:56ch}
.reveal{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.reveal .ans{font-family:var(--f-head);font-size:2rem;color:var(--link);line-height:1.1}
.legend{display:grid;gap:8px;margin:12px 0}
.legend div{display:flex;gap:10px;align-items:flex-start}
.modnav{display:flex;justify-content:space-between;gap:10px;margin-top:36px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;z-index:80;font-weight:600;max-width:90vw}
.note{padding:10px 14px;border-radius:4px;border-left:5px solid var(--miss);background:var(--miss-bg);margin:10px 0}
.lit{display:grid;gap:10px}
.lit .li{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.lit .li small{display:block;color:var(--muted)}
@media(max-width:600px){.lit .li{grid-template-columns:minmax(0,1fr)}}
.avail{font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.avail.dl{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.avail.mail{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.avail.web{background:var(--yellow-soft);border:1px solid var(--yellow)}
footer.foot{margin-top:50px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* Termine: Umschalter Präsentation / Aufgaben */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:18px;border:2px solid var(--accent);border-radius:6px;overflow:hidden;max-width:640px}
.seg a{display:flex;flex-direction:column;gap:2px;padding:10px 14px;text-decoration:none;color:var(--link);background:var(--card);min-width:0}
.seg a b{font-family:var(--f-head);font-size:1.3rem;line-height:1.1}
.seg a span{font-size:.88rem;color:var(--muted)}
.seg a[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.seg a[aria-selected="true"] span{color:var(--accent-ink);opacity:.85}
.navsub{display:block;font-size:.75rem;opacity:.7;font-weight:400;line-height:1.2}
.slidecard{background:var(--card);border:1px solid var(--line);border-radius:6px;margin:14px 0;overflow:hidden}
.slidecard .sch{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.slidecard .sch h3{font-size:1.25rem;margin:0;flex:1;min-width:0}
.slidecard .sn{flex:none;width:30px;height:30px;border-radius:4px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-head);font-weight:700}
.slidecard .sb{padding:6px 18px 14px;min-width:0}
.btn.sm{min-height:34px;padding:3px 10px;font-size:.85rem}
.handover{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-left:6px solid var(--yellow)}
.handover .btn{margin-left:auto}
.paket{background:var(--yellow-soft);border:1px solid var(--yellow);border-radius:6px;padding:12px 16px;display:grid;gap:4px;margin:6px 0 10px}
.paket b{font-family:var(--f-head);font-size:1.3rem;margin-right:8px}
.road li .rbtn{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:560px){.road li .rbtn{grid-column:2}}
.agenda{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px}
.agenda li{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:12px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
.agenda li b{font-family:var(--f-head);font-size:1.2rem;color:var(--link)}
.agenda li.cur{border:2px solid var(--yellow);background:var(--yellow-soft)}
.big{font-size:1.25rem;font-weight:600} .big2 li{font-size:1.15rem;margin:.35em 0} .huge{font-family:var(--f-head);font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.15;font-weight:700;color:var(--link);margin:.3em 0}
.muted{color:var(--muted)}
.sl-reveal summary{cursor:pointer;display:inline-block;background:var(--yellow);color:#14232f;font-weight:700;padding:8px 18px;border-radius:4px;list-style:none}
.sl-reveal summary::-webkit-details-marker{display:none}
.sl-reveal[open] summary{display:none}
/* Präsentationsmodus */
.pr{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pr-stage{flex:1;overflow:auto;display:flex;justify-content:center;padding-block:2vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pr-slide{width:100%;max-width:1200px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:clamp(16px,3vw,40px) clamp(18px,4vw,56px);display:flex;flex-direction:column;font-size:clamp(17px,1.55vw,24px);min-width:0;align-self:flex-start;min-height:calc(100% - 4px)}
.pr-top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.75em;border-bottom:3px solid transparent;border-image:repeating-linear-gradient(90deg,var(--blue) 0 14px,var(--yellow) 14px 20px) 1;padding-bottom:8px}
.pr-top img{height:1.9em;width:auto;background:#fff;padding:3px 6px;border-radius:4px}
.pr-slide h2{font-size:2.1em;margin:.45em 0 .35em}
.pr-body{flex:1;min-width:0}
.pr-body .fig svg{max-height:62vh}
.pr-body .tile p,.pr-body .tile li,.pr-body ul.il li,.pr-body .three div,.pr-body .layers span,.pr-body .flow .st span,.pr-body .vs dl,.pr-body .hfg div,.pr-body .mt,.pr-body .matrix,.pr-body .states{font-size:.95em}
.pr-body .cite,.pr-body figcaption{font-size:.62em}
.pr-foot{margin-top:14px;font-size:.55em;color:var(--muted);text-align:right}
.pr-bar{display:flex;justify-content:center;align-items:center;gap:12px;padding:8px;background:var(--side);color:var(--side-ink)}
.pr-btn{min-width:48px;min-height:44px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--side-ink);border-radius:4px;font-size:1.2rem;cursor:pointer}
.pr-btn:disabled{opacity:.35;cursor:default}
.pr-count{font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

{ id: 's1', nav: 'Technikbegriff', no: '1', title: 'Was ist Technik?', eyebrow: 'Sitzung 1',
  lead: 'Du klärst, was mit „Technik“ gemeint ist – bei Ropohl, im Kerncurriculum und für Schüler:innen der 6. Klasse.',
  meta: ['ca. 90 Min.', 'Material: Ropohl 2009 (Download), KC Technik RS 2010, KC AWT IGS'],
  leit: ['Wie definiert Ropohl Technik – und wie erklärst du das einem Kind?', 'Welche Dimensionen hat Technik?', 'Welchen Technikbegriff haben die niedersächsischen Kerncurricula?'],
  body: [
`<div class="sec">Impuls</div>
<div class="quote"><p>„Ein Computer wird erst wirklicher Computer, wenn er zum Teil einer Mensch-Maschine-Einheit geworden ist. […] erst die Arbeitseinheit von Mensch und Computer bringt die Textverarbeitung zuwege. Da freilich im benutzten Computer immer schon die Arbeit anderer Menschen verkörpert ist […], bezeichne ich sie als soziotechnisches System.“</p><cite>Ropohl (2009): Allgemeine Technologie, S. 58</cite></div>
<h2>Ropohls Technikbegriff</h2>
${FIG.ropohlDef}
${FIG.weite}`,
  { id: 's1a1', type: 'text', title: 'Ropohl für die 6. Klasse', q: 'Beschreibe in eigenen Worten, wie Ropohl „Technik“ definiert. <b>Bedingung:</b> Schüler:innen der 6. Klasse sollen deine Definition verstehen.',
    info: `<p>Das ist <b>didaktische Reduktion</b>: vereinfachen, ohne zu verfälschen.</p>${FIG.reduktion}`,
    eh: ['Alle drei Teile sind enthalten: Dinge, die Menschen herstellen (a), das Herstellen (b) und das Benutzen (c).', 'Ein Alltagsbeispiel aus der Welt der Kinder (Fahrrad, Handy, Toaster) macht die drei Teile sichtbar.', 'Kurze Sätze, keine Fachwörter ohne Erklärung („Artefakt“, „Sachsystem“).', 'Nicht verfälscht: Technik ist nicht nur Elektronik oder „Geräte“ – auch ein Holzlöffel und das Benutzen gehören dazu.', 'Typ der Reduktion benannt: eher horizontal (Beispiel) oder vertikal (Ausschnitt)?'] },
`<h2>Dimensionen der Technik</h2>${FIG.ropohl}`,
  { id: 's1a2', type: 'sort', title: 'Perspektiven zuordnen', q: 'Ordne die Erkenntnisperspektiven der richtigen Dimension zu. Tippe erst auf einen Begriff, dann auf die Dimension.',
    bins: ['Soziale Dimension', 'Humane Dimension', 'Naturale Dimension'],
    items: [['ökonomisch', 0], ['juridisch', 0], ['politologisch', 0], ['soziologisch', 0], ['ethisch', 1], ['ästhetisch', 1], ['psychologisch', 1], ['physiologisch', 1], ['anthropologisch', 1], ['ökologisch', 2], ['chemisch', 2], ['ingenieurwissenschaftlich', 2], ['biologisch', 2]],
    explain: 'Nach Ropohl (2009), Bild 1. Binder (2014, S. 3) betont: Wer Technik nur ingenieur- oder naturwissenschaftlich betrachtet, versteht z. B. beim Pkw weder Design noch Straßenverkehrsordnung noch Umweltfolgen.' },
  { id: 's1a3', type: 'mc', title: 'Wie weit ist Ropohls Begriff?', q: 'Welcher Begriffsweite nach Binder entspricht Ropohls Definition?', opts: ['eng – nur die künstlich hergestellten Dinge', 'mittelweit – Artefakte und alle Handlungen mit ihnen', 'weit – alles kunstfertige, zweckorientierte Handeln'], ans: [1], fixed: true,
    explain: 'Binder (2014, S. 2) ordnet die mittelweite Verwendung Ropohl zu: Technikgenese, -distribution, -nutzung und -auflösung gehören dazu.' },
  { id: 's1a4', type: 'grid', title: 'Ein Gegenstand, drei Dimensionen', q: 'Wähle einen Gegenstand (z. B. E-Scooter, Smartphone, Wärmepumpe). Formuliere je Dimension eine Frage, die man im Unterricht stellen könnte.',

    eh: ['Beispiel E-Scooter: Wer haftet bei Unfällen, wer darf wo fahren? (sozial – juridisch, politologisch)', 'Warum fühlen sich manche auf dem Scooter cool, andere unsicher? (human – psychologisch, ästhetisch)', 'Wie lange hält der Akku, wie wird er recycelt? (natural – ingenieurwissenschaftlich, ökologisch)'] },
`<h2>Der Technikbegriff im Kerncurriculum</h2>
<div class="grid2"><div class="tile"><h4>KC Technik Realschule (2010)</h4><p>Kap. 1 „Bildungsbeitrag des Faches Technik“, S. 7 f.</p></div>
<div class="tile y"><h4>KC AWT IGS (MK 2023)</h4><p>Kap. 1 „Bildungsbeitrag“, S. 5 f., und Kap. 2.2 „Technisches und textiltechnisches Themenfeld“, S. 11</p></div></div>
<p class="cite">Beide Kerncurricula stehen als PDF auf dem Niedersächsischen Bildungsserver (nibis.de).</p>`,
  { id: 's1a5', type: 'text', title: 'Technik im KC', q: 'Erkläre, wie die beiden Kerncurricula den Begriff „Technik“ bzw. das Fach beschreiben.',
    eh: ['KC RS: Technik als Hilfsmittel zur Gestaltung und Umgestaltung der Lebenswelt; vier Handlungsbereiche (Arbeiten und Produzieren, Energie und Technik, Information und Kommunikation, Natur und Technik).', 'KC RS: Technik entsteht in gesellschaftlichen Zusammenhängen (sozial, politisch, ökonomisch, ökologisch, ethisch); Teil der kulturellen Identität; Chancen und Risiken; Beitrag zur BNE-Gestaltungskompetenz.', 'KC AWT: „Technik ist ein wesentlicher Bestandteil unserer Kultur“; der Mensch verändert die Natur mithilfe der Technik; Digitalität und KI verlangen technisches Grundverständnis.', 'KC AWT: Strukturelemente Stoff, Energie, Information; Technik ist Teil eines integrierten Fachs mit Fokus auf den Übergang Schule–Beruf.'] },
  { id: 's1a6', type: 'grid', title: 'KC und Ropohl vergleichen', q: 'Nenne und erläutere Gemeinsamkeiten und Unterschiede zwischen dem Technikbegriff der Kerncurricula und Ropohls Dimensionen.', cols: ['KC Technik RS', 'KC AWT IGS'], rows: ['Gemeinsamkeiten mit Ropohl', 'Unterschiede zu Ropohl'],

]},
{ id: 's2', nav: 'Fächerkanon', no: '2', title: 'Technik im Fächerkanon', eyebrow: 'Sitzung 2',
  lead: 'Jedes Schulfach muss begründen, warum es da ist. Du prüfst die Begründung für Technik – und ob Technik nicht in Physik aufgehen könnte.',
  meta: ['ca. 90 Min.', 'Material: Binder 2014, Brandt/VDI 2011, Schulversuch RBG, Video Harald Lesch'],
  leit: ['Wie begründet sich das Fach Technik?', 'Ist Technik angewandte Naturwissenschaft?', 'Eigenes Fach, Fächerverbund oder Projekt?'],
  body: [
`<div class="sec">Impuls</div>
<div class="quote"><p>„Grundsätzlich muss jedes Schulfach im allgemeinbildenden Schulwesen seine Notwendigkeit darlegen können. Es muss Intentionen (Absichten, Zielrichtungen) beschreiben und sie den Lernenden und der Gesellschaft gegenüber begründen können.“</p><cite>Binder (2014): Theorien und Modelle der Technikdidaktik, S. 7</cite></div>
<div class="quote"><p>„Technische Bildung steht unter der leitenden Zielsetzung des mündigen, selbstbestimmten Menschen, der fähig ist, in technisch geprägten Lebenssituationen sachkompetent zu handeln und sich verantwortungsbewusst zu entscheiden.“</p><cite>Wilkening et al. (1977), S. 12, zit. n. Binder (2014), S. 8</cite></div>
<div class="card"><b>Video:</b> Harald Lesch zum Fächerkanon – <a href="https://youtu.be/Wj-KTcxjLqs" target="_blank" rel="noopener">youtu.be/Wj-KTcxjLqs</a></div>`,
  { id: 's2a1', type: 'text', title: 'Intentionen des Fachs', q: 'Arbeite mithilfe des Kerncurriculums heraus, welche Intentionen das Fach Technik hat und wie sie begründet werden.',
    eh: ['Intentionen (KC RS, S. 7 f.): technische Objekte entwickeln, herstellen, bedienen; Entwicklungen bewerten; Probleme innovativ lösen; Teamarbeit; ethische Maßstäbe; verantwortlich handeln; Gestaltungskompetenz (BNE); Medienkompetenz; berufliche Orientierung.', 'Begründungen: Technik prägt Gesellschaft und kulturelle Identität; Chancen und Risiken müssen erkannt, bewertet und beherrscht werden.', 'Vergleich mit Wilkening: Mündigkeit, sachkompetentes Handeln und verantwortungsbewusstes Entscheiden.'] },
  { id: 's2a2', type: 'text', talk: true, title: 'Was würde Harald Lesch sagen?', q: 'Überlege, wie Harald Lesch zum Fach Technik stehen könnte. Notiere zwei Argumente für das Gespräch.' },
`<h2>Ist Technik angewandte Naturwissenschaft?</h2>${FIG.nwT}
<div class="merke"><b class="t">Binder (2014, S. 3)</b>Die Aussage, Technik sei „angewandte Naturwissenschaften“, ist eine Verkürzung: Technische Lösungen folgen Naturgesetzen, aber vor allem humanen und sozialen Sinnzusammenhängen.</div>`,
  { id: 's2a3', type: 'assign', title: 'Naturwissenschaft oder Technik?', q: 'Ordne die Merkmale zu.', opts: ['Naturwissenschaft', 'Technik'],
    rows: [['fragt nach Ursache und Wirkung', 0], ['fragt nach Sinn und Zweck', 1], ['bewertet nach „gut oder schlecht“', 1], ['bewertet nach „richtig oder falsch“', 0], ['arbeitet synthetisch und problemlösend', 1], ['untersucht, was von Natur aus da ist', 0], ['entwickelt eine Schiffsschraube oder ein Windrad', 1], ['analysiert Rotationsbewegungen', 0]],
    explain: 'Nach Brandt (2011), S. 4–6. Das Beispiel Windrad/Rotationsbewegung stammt ebenfalls aus dem VDI-Papier.' },
`<h2>Ein Fall aus Hildesheim</h2>
<div class="card"><p><b>Schulversuch der Robert-Bosch-Gesamtschule Hildesheim (ab 2009):</b> Aus AWT und Naturwissenschaften wird AW, Physik/Technik und Naturwissenschaften. Ab Jahrgang 8 lernen alle Schüler:innen im Fach „Physik/Technik“ – praxisorientiert, mit Fischertechnik-Modellen, einem selbst gebauten Elektromotor und einer Hausinstallation. Partner: Robert Bosch GmbH, Handwerkskammer, Institut für Physik und Technik der Uni Hildesheim.</p><p class="cite">Müller, S.: Die Einrichtung des neuen Unterrichtsfachs „Physik/Technik“. Ein Projekttagebuch. Website der RBG, abgerufen 28.10.2016.</p></div>`,
  { id: 's2a4', type: 'text', talk: true, title: 'Physik und Technik zusammenlegen?', q: 'Wie findest du den Schulversuch? Würdest du die Fächer Physik und Technik zusammenlegen? Begründe.' },
  { id: 's2a5', type: 'mc', title: 'Und der VDI?', q: 'Würde der VDI (Brandt 2011) Technik und Naturwissenschaften zusammenlegen?', opts: ['Ja – Technik ist im Physikunterricht gut aufgehoben.', 'Nein – Integration in Physik/Chemie ist „kontraproduktiv“, weil die Fragestellungen gegensätzlich sind.', 'Der VDI äußert sich dazu nicht.'], ans: [1], fixed: true,
    explain: 'Brandt (2011, S. 3): Ein Fach „Natur und Technik“, das eigenständigen Technikunterricht entbehrlich macht, sei kontraproduktiv und stärke die technische Bildung nicht.' },

{ id: 's3', nav: 'Mehrperspektivisch', no: '3', title: 'Der mehrperspektivische Technikunterricht', eyebrow: 'Sitzung 3',
  lead: 'Der mehrperspektivische Ansatz (mpTu) prägt die Technikdidaktik bis heute. Du lernst sein Gerüst kennen und suchst es im Kerncurriculum.',
  meta: ['ca. 90 Min.', 'Material: Bienhaus 2008, KC Technik RS 2010'],
  leit: ['Was unterscheidet Erkenntnis- von Zielperspektiven?', 'Welche Inhaltsfelder hat der mpTu?', 'Wie mehrperspektivisch ist das Kerncurriculum?'],
  body: [
`<div class="sec">Input</div>${FIG.mptu}
<div class="merke"><b class="t">Mehrperspektivisch ≠ mehrdimensional</b>„Mehrperspektivisch“ meint nicht, möglichst viele Wissenschaften zu berücksichtigen – dann wäre „mehrdimensional“ passender. Gemeint ist ein Unterricht, der die Zielperspektiven verfolgt (Bienhaus 2008, S. 3).</div>`,
  { id: 's3a1', type: 'text', title: 'Zwei Begriffe klären', q: 'Lies den Auszug „Technikdidaktik – der mehrperspektivische Ansatz“ von Bienhaus. Erkläre die Begriffe <b>Erkenntnisperspektive</b> und <b>Zielperspektive</b> und nenne die jeweiligen Perspektiven.',
    eh: ['Erkenntnisperspektiven (Schmayl): Blickrichtungen auf den Gegenstand Technik; sie stecken das thematische Terrain ab – Sachperspektive, human-soziale Perspektive, Sinn- und Wertperspektive.', 'Zielperspektiven (Sachs 1992): Richtziele des Unterrichts – technische Kenntnisse und Strukturzusammenhänge, technisches Handeln, Bedeutung und Bewertung technischer Sachverhalte, vorberufliche Orientierung.', 'Zusammenhang: Zielperspektive 1 und 2 erschließen die Sachdimension, 3 die human-soziale Dimension; 3 setzt 1 und 2 voraus und ist die anspruchsvollste.'] },
  { id: 's3a2', type: 'sort', title: 'Welche Perspektive?', q: 'Ordne die Aussagen den drei Erkenntnisperspektiven nach Schmayl zu.', bins: ['Sachperspektive', 'human-soziale Perspektive', 'Sinn- und Wertperspektive'],
    items: [['Funktionsabläufe und Wirkbedingungen', 0], ['technische Regeln und Naturgesetze', 0], ['Bedienungswissen', 0], ['Technik als „Urhumanum“', 1], ['gesellschaftliche Vorbedingungen technischen Handelns', 1], ['Abhängigkeit des Menschen von seinen Hervorbringungen', 1], ['Technik ist nicht wertneutral', 2], ['Folgen abschätzen, Verantwortung übernehmen', 2]],
    explain: 'Nach Bienhaus (2008), S. 2 f.' },
  { id: 's3a3', type: 'mc', title: 'Allgegenwärtig', q: 'Welche Zielperspektive ist laut Bienhaus „im Unterricht allgegenwärtig“ und in die anderen eingebunden?', opts: ['technische Kenntnisse und Strukturzusammenhänge', 'technisches Handeln', 'Bedeutung und Bewertung technischer Sachverhalte', 'vorberufliche Orientierung'], ans: [3], fixed: true,
    explain: 'Bienhaus (2008), S. 4. Gegen Ende der Schulzeit bekommt sie im Kontext der Berufswahl besonderes Gewicht.' },
  { id: 's3a4', type: 'mc', title: 'Die Anspruchsvollste', q: 'Welche Zielperspektive nennt Bienhaus die anspruchsvollste?', opts: ['technische Kenntnisse und Strukturzusammenhänge', 'technisches Handeln', 'Bedeutung und Bewertung technischer Sachverhalte', 'vorberufliche Orientierung'], ans: [2], fixed: true,
    explain: 'Sie setzt technische Handlungsfähigkeit und technisches Wissen voraus und richtet sich auf human-soziale und normative Sachverhalte (Bienhaus 2008, S. 4).' },
  { id: 's3a5', type: 'grid', title: 'Erkenntnisperspektiven im KC', q: 'Analysiere, wo sich die Erkenntnisperspektiven nach Schmayl im KC Technik für die Realschule wiederfinden.', cols: ['Fundstelle im KC (Seite, Zitat)', 'Wie stark vertreten?'], rows: ['Sachperspektive', 'human-soziale Perspektive', 'Sinn- und Wertperspektive'],
    eh: ['Sach: „Auf der Sachebene befähigt das Fach dazu, technische Objekte zu entwickeln und herzustellen …“ (S. 7) – stark, prägt auch die Kompetenzbereiche.', 'Human-sozial: „Die Erfindung, Konstruktion und Anwendung technischer Mittel geschah und geschieht in gesellschaftlichen Zusammenhängen …“ (S. 7).', 'Sinn und Wert: „ethische Maßstäbe entwickeln“, Risiken „erkennen, bewerten und beherrschen“ (S. 7).', 'Prüfe in den erwarteten Kompetenzen, ob die Perspektiven dort ähnlich gewichtet sind wie im Bildungsbeitrag.'] },

]},
{ id: 's4', nav: 'Methoden & Modelle', no: '4', title: 'Methoden und weitere Modelle', eyebrow: 'Sitzung 4',
  lead: 'Vom Methodensystem des mpTu über Maker Education bis zu den großen Ansätzen der Technikdidaktik und dem Interaktionsmodell.',
  meta: ['ca. 90 Min.', 'Material: Bienhaus 2008, Binder 2014 (Kap. 4), Hüttner Kap. 2.5, Ingold/Maurer 2019'],
  leit: ['Reicht die Projektmethode für guten Technikunterricht?', 'Ist Maker Education eine neue Methode?', 'Welche Ansätze stecken im heutigen Kerncurriculum?'],
  body: [
`<div class="sec">Methodensystem</div>${FIG.methoden}`,
  { id: 's4a1', type: 'assign', title: 'Welche Methode ist das?', q: 'Ordne die Unterrichtssituationen den Methoden des mpTu zu.', opts: ['Projektmethode', 'Erfindendes Konstruieren', 'Nachvollziehendes Fertigen', 'Lehrgangsmäßiges Instruieren', 'Forschendes Experimentieren', 'Analysieren der Realtechnik'],
    rows: [['Die Klasse plant über sechs Wochen eine Sitzecke für den Schulhof und setzt sie um.', 0], ['Schüler:innen entwickeln eine eigene Halterung, die ein Tablet in zwei Winkeln hält.', 1], ['Alle bauen nach Bauplan ein Vogelhaus.', 2], ['Die Lehrkraft führt das Weichlöten Schritt für Schritt ein.', 3], ['Gruppen testen, welches Material die größte Last trägt.', 4], ['Ein alter Toaster wird zerlegt, um seine Funktion zu verstehen.', 5]],
    explain: 'Die Beispiele sind eigene Formulierungen; im Unterricht mischen sich die Methoden oft – das ist ja der Sinn eines Methoden<b>systems</b>.' },
  { id: 's4a2', type: 'fields', title: 'Reicht die Projektmethode?', q: 'Notiere Vor- und Nachteile der Projektmethode. Begründe dann deine Meinung zur These: <b>„Die Projektmethode reicht aus, um guten Technikunterricht zu machen.“</b>',
    fields: [['pro', 'Vorteile'], ['contra', 'Nachteile'], ['these', 'Meine Meinung zur These']],
    eh: ['Bienhaus (2008, S. 5): Es kann keine Universalmethode geben – gegen die Auffassung, mit der Projektmethode (früher Werkaufgabe) sei „die allein selig machende Methode“ gefunden.', 'Ein Methodensystem ist ein Beziehungsgeflecht sich ergänzender Methoden.', 'Die human-soziale Dimension braucht eigene Verfahren (Studien, Dokumentationen, Erkundungen an außerschulischen Lernorten).', 'Pro Projekt: Motivation, Selbstständigkeit, Komplexität, Bezug zum IGS-Erlass Nr. 4.3. Contra: Zeit, fehlende Grundlagen ohne Lehrgang, ungleiche Beteiligung.'] },
`<h2>Maker Education – eine neue Methode?</h2>
<div class="quote"><p>„Alles, was Schule anfasst, wird zu Schule.“</p><cite>Deinet (2002), zit. n. Ingold & Maurer (2019): Making in der Schule. In: Chance MakerSpace, S. 60</cite></div>
<p>Ingold und Maurer sehen Schnittmengen von Making mit Projektunterricht, praktischem und handlungsorientiertem Lernen und mit der Reformpädagogik (Pestalozzi, Montessori, Kerschensteiner, Dewey). Reibungspunkte entstehen bei Fehlerkultur, Bewertung, Taktung und Raum.</p>`,
  { id: 's4a3', type: 'text', talk: true, title: 'Making einordnen', q: 'Ist Maker Education eine neue Methode – oder alter Wein in neuen Schläuchen? Vergleiche Making mit der Projektmethode und dem erfindenden Konstruieren.',
    eh: ['Gemeinsam: Problem- oder Ideenorientierung, eigene Lösungen, Handlungsorientierung – erfindendes Konstruieren ist dem Making sehr nah.', 'Neu am Making: offener Zugang zu Werkzeugen und Material, digitale Fabrikation, Iteration (Prototyp – Test – Redesign), Teilen der Ergebnisse, Fehler als Lernchance.', 'Ingold/Maurer (2019): Gefahr der „Verschulung“ – Making wird auf Materialboxen und Doppelstunden reduziert.'] },
`<h2>Ansätze der Technikdidaktik</h2>${FIG.ansaetze}
<div class="grid3"><div class="tile"><h4>AtA</h4><p>ingenieurwissenschaftlich; Grundfunktionen (Wandeln, Speichern, Übertragen) und Systemattribute (Stoff, Energie, Information); stark in NRW</p></div>
<div class="tile y"><h4>MpA</h4><p>Technik als Kulturphänomen; alle drei Erkenntnisperspektiven; Sachs, Schmayl, Schulte, Wiesmüller, Schlagenhauf, Mackeprang</p></div>
<div class="tile r"><h4>AoA</h4><p>Leitbegriff Arbeit (Arbeitslehre); Technik als Teil von Verbünden wie AWT oder WAT; Berufsorientierung, Praktika; Verband GATWU</p></div></div>
<p class="cite">Nach Binder (2014), Kap. 4.2–4.4, S. 20 f.</p>`,
  { id: 's4a4', type: 'assign', title: 'Welcher Ansatz?', q: 'Ordne die Merkmale dem passenden Ansatz zu.', opts: ['allgemeintechnologisch (AtA)', 'mehrperspektivisch (MpA)', 'arbeitsorientiert (AoA)'],
    rows: [['Lehrplan nach Grundfunktionen: Wandeln, Speichern, Übertragen', 0], ['Systemattribute Stoff, Energie, Information', 0], ['Technik als Kulturphänomen, Spiegel menschlichen Handelns', 1], ['alle drei Erkenntnisperspektiven einbeziehen', 1], ['Technik unter dem Aspekt ihres Einflusses auf das Arbeitsleben', 2], ['Ziel sind Fächerverbünde wie AWT oder WAT', 2], ['Professuren mit Ingenieuren besetzt, Wissenschaftseuphorie der 1970er', 0], ['Betriebspraktika und Berufsorientierung als Schwerpunkt', 2]],
    explain: 'Binder (2014), S. 20 f. Kritik: Der AtA bildet humane und gesellschaftliche Wechselwirkungen nicht ab; die Arbeitslehre klärt ihren Gegenstand „Arbeit“ nicht eindeutig.' },
  { id: 's4a5', type: 'text', talk: true, title: 'Welche Ansätze stecken im KC AWT?', q: 'Das KC AWT für die IGS nennt „die technischen Strukturelemente Stoff, Energie, Information“ als grundlegend (S. 11) und verbindet Arbeit, Hauswirtschaft, Wirtschaft und Technik zu einem Fach. Welche technikdidaktischen Ansätze erkennst du?',
    eh: ['AtA: Stoff, Energie, Information als Strukturelemente.', 'AoA: Fächerverbund AWT, Fokus auf den Übergang Schule–Beruf, Berufswahlkompetenz.', 'MpA-Elemente: Technik als Teil der Kultur, Technikfolgenabschätzung, Verknüpfung mit gesellschaftlichen und politischen Fragen.', 'Fazit: ein Mischansatz – spannend für die Frage, was von einer eigenständigen Technikdidaktik bleibt.'] },
`<h2>Das Interaktionsmodell nach Hüttner</h2>${FIG.huettner}`,
  { id: 's4a6', type: 'sort', title: 'Ebenen zuordnen', q: 'Lies den Text zum Interaktionsmodell. Ordne die Elemente den vier Ebenen zu.', bins: ['Theorieebene', 'Analyseebene', 'Planungsebene', 'Interaktionsebene'],
    items: [['Forschungsmethoden', 0], ['Rahmenziel', 0], ['Leitlinien: historisch, gegenwärtig, Trends', 0], ['anthropogene Voraussetzungen ermitteln', 1], ['Bildungsgehalt bestimmen', 1], ['Handlungsorientierungen erarbeiten', 2], ['Unterrichtsplanung theoretisch erörtern', 2], ['Medieneinsatz', 3], ['Lernkontrolle', 3], ['Lehr- und Lernhandlungen', 3]],
    explain: 'Nach Hüttner, Kap. 2.5. Die Theorieebene durchdringt alle anderen Ebenen und wird durch Rückkopplung bereichert.' },
  { id: 's4a7', type: 'fields', title: 'Modell strukturieren', q: 'Strukturiere das Modell mit einer Methode deiner Wahl (empfohlen: Mindmap, z. B. in Notability). Halte hier fest:',
    fields: [['methode', 'Gewählte Methode', 1], ['erk', 'Meine drei wichtigsten Erkenntnisse'], ['frage', 'Eine offene Frage für das Gespräch']] },
`<details class="info"><summary>Zum Vergleich: das Berliner Modell</summary><div class="ib">${FIG.berlin}</div></details>`,
  { id: 's4a8', type: 'text', talk: true, title: 'Berlin trifft Hüttner', q: 'Welche Felder des Berliner Modells findest du im Interaktionsmodell wieder? Wo geht Hüttner darüber hinaus?',
    eh: ['Bedingungsfelder ↔ anthropogene Voraussetzungen (Analyseebene) und „Bedingungen“ der Lernorganisation.', 'Entscheidungsfelder (Ziele, Inhalt, Methode, Medien) ↔ Lernorganisation auf der Interaktionsebene.', 'Folgen ↔ Lernkontrolle.', 'Darüber hinaus: eine fachspezifische Theorieebene mit Rahmenziel, Anwendungsfeldern und Leitlinien der Technikentwicklung.'] }
]},
{ id: 's5', nav: 'Aktuelle Entwicklungen', no: '5', title: 'Aktuelle Entwicklungen im Technikunterricht', eyebrow: 'Sitzung 5 · Gespräch',
  lead: 'Ein Blick aus der Praxis: Was bewegt Fachbereiche und Fachräume? Zwei Schwerpunkte vertiefst du: MakerSpaces und selbst entwickelte digitale Lernmaterialien.',
  meta: ['ca. 90 Min., als Gespräch', 'Material: Ingold/Maurer/Trüby 2019 (Download), MakerSpace-Kompass'],
  leit: ['Wo steht der Technikunterricht in Niedersachsen?', 'Warum wird ein MakerSpace selten zum guten Konzept, wenn er als Robotik-Fachraum startet?', 'Was macht ein gutes selbst entwickeltes digitales Lernmaterial aus?'],
  body: [
`<div class="sec">Lagebild</div>${FIG.lage}`,
  { id: 's5a1', type: 'thesen', title: 'Thesen für das Gespräch', q: 'Positioniere dich zu den Thesen und notiere jeweils ein Argument. Wir starten das Gespräch mit der These, bei der du am unsichersten bist.',
    items: ['Der Lehrkräftemangel trifft die praktischen Fächer stärker als andere.', '3D-Druck und Arduino machen den Technikunterricht moderner.', 'Ein MakerSpace ohne Konzept wird zum Gerätefriedhof.', 'Technik sollte im Fächerverbund AWT aufgehen.', 'Lehrkräfte sollten digitale Lernmaterialien selbst entwickeln, statt fertige zu nutzen.', 'Badges können Noten im Technikunterricht ergänzen.'] },
`<h2>Schwerpunkt A: MakerSpace statt Robotik-Fachraum</h2>
<p>Viele Schulen verstehen einen MakerSpace als Raum mit Robotern, 3D-Druckern und Lasercuttern. So landet er als teurer Fachraum im Katalog. Die Maker-Bewegung meint etwas anderes: Menschen kommen zusammen, entwickeln Ideen und setzen sie mit vorhandenen Werkzeugen und Materialien um.</p>
${FIG.robotik}
<div class="merke"><b class="t">Robotik in der Schule</b>Im Vordergrund steht meist das Programmieren von Robotern, weniger deren Konstruktion – mit vorkonfektionierten Modulen und fertigen Sets. Projekte, die Physical Computing mit der Konstruktion eigener Produkte verbinden, sind eher die Ausnahme (Ingold & Maurer 2019, S. 72 f.).</div>
<h3 style="margin-top:22px">Neun Handlungsfelder – nur zwei betreffen Raum und Ausstattung</h3>${FIG.hf}
<div class="card"><b>Vertiefen:</b> Im <a href="${COURSE.kompass}" target="_blank" rel="noopener">MakerSpace-Kompass</a> findest du die Handlungsfelder mit Leitfragen, Reibungspunkten und Werkstätten (Zonenplaner, Projekt-Canvas, Nutzungskonzept-Check). Beispiel aus der Praxis: An der KGS Gronau wurde der Maschinenraum zum MakerSpace.</div>`,
  { id: 's5a2', type: 'mc', title: 'Schnellcheck', q: 'Wie viele der neun Handlungsfelder nach Maurer & Ingold betreffen Raum und Ausstattung?', opts: ['zwei', 'vier', 'sechs', 'alle neun'], ans: [0], fixed: true, explain: 'Raumgestaltung (6) und Material- und Geräteausstattung (7). Trotzdem wird die Ausstattung oft zuerst gefragt – weil Fördergeld fließt.' },
  { id: 's5a3', type: 'fields', title: 'Fallanalyse: der neue MakerSpace', q: '<b>Fall:</b> Eine Gesamtschule kauft aus Fördermitteln 15 Robotik-Sets, zwei 3D-Drucker und einen Lasercutter und nennt einen umgebauten Raum „MakerSpace“. Nach einem Jahr nutzen ihn zwei Lehrkräfte im Wahlpflichtkurs Technik. Analysiere den Fall mit den neun Handlungsfeldern.',
    fields: [['hf', 'Welche Handlungsfelder wurden vernachlässigt? (mit Begründung)'], ['schritte', 'Drei nächste Schritte, die du der Schulleitung empfiehlst']],
    eh: ['Vernachlässigt: Ziele und Making-Kompetenzen (1), Haltung (2), Didaktik (3), Curriculum (5), Weiterbildung (8), Organisation und Einbindung (9) – berücksichtigt wurden nur 6 und 7.', 'Folge: Making bleibt punktuell und an einzelne Lehrkräfte gebunden; Gefahr „Gerätefriedhof“.', 'Schritte: Ziele und Projektideen mit Fachgruppen und Schüler:innen klären (IGS-Erlass Nr. 4.5), Nutzungskonzept und Zeitfenster festlegen, kollegiumsinterne Maker-Nachmittage, Raum für alle Fächer öffnen; Maschinenarbeit bleibt nach RiSU im Fachraum.'] },
`<h2>Schwerpunkt B: Digitale Lernmaterialien selbst entwickeln</h2>
<p>Lehrkräfte bauen zunehmend eigene interaktive Lernumgebungen – nicht mehr nur Arbeitsblätter, sondern Plattformen mit Aufgaben, Rückmeldung und Export. KI-Werkzeuge senken die technische Hürde deutlich. Damit verschiebt sich die Frage: Nicht mehr „Kann ich das bauen?“, sondern „Ist das gut – und darf ich das teilen?“</p>
${FIG.digital}
<div class="grid2"><div class="tile g"><h4>Chancen</h4><ul class="il"><li>passgenau zum eigenen Unterricht und KC</li><li>direkte Rückmeldung, Differenzierung</li><li>teilbar im Kollegium und darüber hinaus (OER)</li></ul></div>
<div class="tile r"><h4>Grenzen</h4><ul class="il"><li>fachliche Prüfung bleibt Aufgabe der Lehrkraft – auch bei KI-Unterstützung</li><li>Datenschutz: keine Konten, keine Schülerdaten auf fremden Servern</li><li>Urheberrecht: Bilder, Texte, Grafiken nur mit klarer Lizenz</li></ul></div></div>
<p class="cite">Rahmen: KMK (2021): Lehren und Lernen in der digitalen Welt – ergänzende Empfehlung zur Strategie „Bildung in der digitalen Welt“ (2016), Beschluss v. 09.12.2021; KC AWT IGS, Kap. 2.4 „Medienkompetenz im AWT-Unterricht“, S. 14.</p>`,
  { id: 's5a4', type: 'checks', title: 'Qualitätscheck einer Lernplattform', q: 'Prüfe eine digitale Lernplattform (z. B. diese hier, den MakerSpace-Kompass oder ein Angebot eines Schulbuchverlags) mit der Prüfliste.',
    pre: { id: 'pf', label: 'Geprüfte Plattform' },
    items: ['Lernziele und KC-Bezug sind erkennbar.', 'Inhalte sind fachlich korrekt und belegt.', 'Aufgaben geben direkte, nachvollziehbare Rückmeldung.', 'Es gibt Differenzierung (Hilfen, Tipps, verschiedene Niveaus).', 'Ergebnisse lassen sich sichern (Export, PDF).', 'Kein Konto nötig, keine personenbezogenen Daten auf fremden Servern.', 'Lesbar auf Tablet und Handy, gute Kontraste, große Schrift.', 'Lizenz ist klar (z. B. CC BY-NC-SA).', 'Die Rolle der Lehrkraft im Unterricht ist mitgedacht.'],
    after: 'Prüfliste: eigene Zusammenstellung, keine Norm.', note: 'Kommentar: Was würdest du verbessern?' },
  { id: 's5a5', type: 'fields', title: 'Mein digitales Lernmaterial', q: 'Skizziere ein eigenes digitales Lernmaterial für den Technikunterricht. Es dient als Grundlage für das Gespräch – und vielleicht für dein Referat.',
    fields: [['thema', 'Thema und Jahrgang', 1], ['kc', 'Bezug zum Kerncurriculum (erwartete Kompetenz)'], ['ziele', 'Lernziele'], ['aufg', 'Aufgabentypen und Rückmeldung'], ['einsatz', 'Einsatz im Unterricht (Phase, Sozialform, Ergebnissicherung)'], ['ki', 'Wo hilft KI beim Erstellen – und wie prüfst du das Ergebnis?'], ['lizenz', 'Lizenz und Weitergabe', 1]] }
]},
{ id: 's6', nav: 'Leistungsbewertung', no: '6', title: 'Leistungsbewertung im Technikunterricht', eyebrow: 'Sitzung 6',
  lead: 'Werkstück, Prozess, Theorie: Was bewertest du im Technikunterricht – und wofür eigentlich?',
  meta: ['ca. 90 Min.', 'Material: IGS-Erlass v. 01.08.2026 (Nr. 7), KGS-Erlass v. 03.08.2015 (Nr. 6)'],
  leit: ['Wozu dient Leistungsbewertung?', 'Wie bewertest du Prozess und Produkt fair?', 'Brauchen wir Noten?'],
  body: [
`<div class="sec">Impuls</div>
<div class="quote"><p>„Klassenbildung sowie Lehrereinsatz sind entscheidende Rahmenbedingungen für den Unterricht. Es ist Aufgabe der Schule, zwischen den Klassen eines Schuljahrgangs einen annähernd gleichen Leistungsstand sicherzustellen.“</p><cite>MK Niedersachsen (2014): Orientierungsrahmen Schulqualität in Niedersachsen, Qualitätsmerkmal 3.3, S. 11</cite></div>
<h2>Wozu dient Leistungsbewertung?</h2>${FIG.funktionen}
<div class="quote"><p>„Die Leistungsbewertung muss den Verlauf eines Lernprozesses berücksichtigen und dokumentieren und darf sich nicht ausschließlich auf punktuelle Leistungsmessung beziehen.“</p><cite>RdErl. „Die Arbeit in den Schuljahrgängen 5 bis 10 der IGS“ v. 01.08.2026, Nr. 7.2</cite></div>
<p>Grundlage sind laut IGS-Erlass (Nr. 7.3): Beobachtungen des Lernprozesses, schriftliche <b>bzw. alternative</b> Leistungsnachweise, mündliche und fachspezifische Leistungen. Mündliche und fachspezifische Leistungen haben besonderes Gewicht.</p>`,
  { id: 's6a1', type: 'sort', title: 'Für wen?', q: 'Für wen erfüllt die Leistungsbewertung welche Funktion? Ordne zu.', bins: ['Schüler:innen', 'Erziehungsberechtigte', 'Lehrkräfte'],
    items: [['Bestätigung und Ermutigung', 0], ['Unterstützung bei der Selbsteinschätzung', 0], ['Lernförderung', 0], ['Information über die Lernentwicklung', 1], ['Information über besondere Lernschwierigkeiten', 1], ['Auskunft über die Wirksamkeit der Lernprozesse', 2], ['Hinweise auf nötige Anpassungen', 2]],
    explain: 'IGS-Erlass v. 01.08.2026, Nr. 7.1 und 7.3.' },
`<h2>Ein Fall aus dem Fachraum</h2>
<div class="grid2"><div class="tile"><span class="k">4</span><p>1. Halbjahr, Thema Arduino</p></div><div class="tile"><span class="k">1</span><p>2. Halbjahr, Thema Holztechnik</p></div></div>
<p>Die Lehrkraft gibt als Gesamtnote eine <b>3+</b>.</p>`,
  { id: 's6a2', type: 'text', title: 'Ist die 3+ gerecht?', q: 'Nimm Stellung zur Gesamtnote. Beziehe dich auf den Erlass.',
    eh: ['Ein rechnerischer Mittelwert ist nicht vorgeschrieben; der Erlass verlangt, den Lernprozess zu berücksichtigen (Nr. 7.2) – nicht nur punktuelle Messung.', 'Unterschiedliche Themen = unterschiedliche Kompetenzbereiche: Ist die 4 in Arduino eine Schwäche im Programmieren oder ein Problem der Einstiegsphase?', 'Lernentwicklung: Eine Steigerung zum Jahresende kann stärker gewichtet werden – wenn das transparent und vorher geregelt ist.', 'Gewichtung und Kriterien gehören in den schuleigenen Arbeitsplan bzw. die Beschlüsse der Fachkonferenz.'] },
`${FIG.rahmen}`,
  { id: 's6a3', type: 'grid', title: 'Bewertungsraster für ein Werkstück', q: 'Entwirf ein Bewertungsraster für den Rahmen mit Eckverbindung. Denke an Produkt <b>und</b> Prozess.', cols: ['Kriterium', 'Woran erkennst du es? (Indikator)', 'Gewicht'], colTypes: ['text', 'text', 'text'], rows: ['1', '2', '3', '4', '5'],
    eh: ['Produkt: Maßhaltigkeit, Rechtwinkligkeit, Passung der Eckverbindung (kein Spalt wie bei Rahmen B), Oberfläche.', 'Prozess: Arbeitsplanung, sachgerechter und sicherer Werkzeuggebrauch, Umgang mit Fehlern, Dokumentation (z. B. Lerntagebuch).', 'Gewichtung offenlegen, bevor gearbeitet wird; Selbsteinschätzung der Schüler:innen einbauen.'] },
  { id: 's6a4', type: 'assign', title: 'Formativ oder summativ?', q: 'Ordne zu.', opts: ['formativ (begleitend, lernfördernd)', 'summativ (abschließend, bilanzierend)'],
    rows: [['Rückmeldegespräch während der Arbeit am Werkstück', 0], ['Klassenarbeit am Ende der Einheit', 1], ['Lerntagebuch mit Kommentar der Lehrkraft', 0], ['Note für das fertige Werkstück', 1], ['Zwischencheck mit Selbsteinschätzung', 0]],
    explain: 'Formative Bewertung steuert das Lernen, summative zieht Bilanz. Beide haben im Technikunterricht ihren Platz.' },
  { id: 's6a5', type: 'text', talk: true, title: 'Noten abschaffen?', q: 'Sollten Noten im Technikunterricht abgeschafft werden? Was können Badges (z. B. Open Badges) leisten – und was nicht?' }
]},
{ id: 's7', nav: 'Referat & Ausarbeitung', no: '7', title: 'Impulsreferat und Ausarbeitung', eyebrow: 'Leistungsnachweis',
  lead: 'Du wählst ein Thema, hältst ein Impulsreferat mit anschließender Diskussion und schreibst eine Ausarbeitung mit Diskussionsergebnissen und Ausblick.',
  meta: ['Ausarbeitung: Abgabe zum Ende des Semesters', 'Note: Ausarbeitung'],
  leit: ['Welches Thema interessiert dich wirklich?', 'Welche Primärquellen trägst du zusammen?', 'Welche Thesen bringst du in die Diskussion?'],
  body: [
  { id: 's7a1', type: 'pick', title: 'Mein Thema', q: 'Wähle ein Thema (oder schlage ein eigenes vor) und begründe kurz deine Wahl.', other: true,
    opts: ['Leistungsbewertung und Leistungskontrollen im Technikunterricht', 'Guter Unterricht – guter Technikunterricht', 'Fachraumkonzepte', 'Binnendifferenzierung im Technikunterricht', 'Förderansätze und Inklusion im Technikunterricht', 'exreTu – expliziter reflexiver Technikunterricht', 'Interessen- und Motivationsforschung (Technik, MINT)', 'Das Neustädter Modell', 'Initiativen zur Technikförderung (z. B. JeT, n-21)', 'Die Reparaturaufgabe im Technikunterricht', 'Kostenlose Unterrichtsmaterialien (z. B. Siemens Stiftung) kritisch prüfen', 'Außerschulische Lernorte als Ergänzung', 'Technikunterricht im föderalen Vergleich', 'Technikunterricht im internationalen Vergleich', 'Unterstützung durch Firmen und Stiftungen', 'NEU: MakerSpace statt Robotik-Fachraum', 'NEU: Digitale Lernmaterialien selbst entwickeln – mit KI', 'NEU: Das KC AWT IGS – was bleibt von der Technikdidaktik?', 'NEU: Didaktische Reduktion am Beispiel Mikrocontroller', 'NEU: BNE im Technikunterricht'] },
`<h2>So baust du das Impulsreferat auf</h2>
<div class="flow"><div class="st"><b>Einstieg</b><span>Fall, Bild, Frage oder Zahl – mit Quelle</span></div><div class="ar">→</div><div class="st"><b>Klärung</b><span>Begriffe und Modelle aus der Technikdidaktik</span></div><div class="ar">→</div><div class="st"><b>Befunde</b><span>Was sagen Primärquellen und Studien?</span></div><div class="ar">→</div><div class="st"><b>Thesen</b><span>2–3 strittige Thesen als Startpunkt der Diskussion</span></div></div>
<div class="merke"><b class="t">Quellen</b>Belege Fakten aus der Primärquelle: Erlass, Kerncurriculum, Originalstudie, Herstellerangabe. Nenne Fundstelle und Stand. Unterscheide „belegt“ von „eine Studie deutet an“.</div>`,

      h('div', { class: 'btnrow' }, h('button', { class: 'btn ghost', type: 'button', disabled: !canSave, onclick: () => saveFile(`Kolloquium_Sicherung_${safe}.json`, JSON.stringify({ app: 'tdk-kolloquium', v: 1, saved: new Date().toISOString(), state: S }, null, 1)) }, 'Sicherungsdatei (.json)')),
      h('div', { class: 'fields', style: 'margin-top:12px' }, h('label', { for: 'ex-load' }, 'Sicherungsdatei laden', fileIn))),
    h('div', { class: 'card' }, h('h3', null, 'Neu anfangen'), h('p', null, 'Löscht alle Eingaben in diesem Browser.'), resetBtn),
    modnav());
}

/* ---------- Start ---------- */
function init() {
  try { const th = localStorage.getItem(KEY + '-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) { }
  document.documentElement.lang = 'de';
  load(); render(); initDownloads();
  window.addEventListener('hashchange', render);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
